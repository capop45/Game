<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sudoku Advanced</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-theme="light">

    <header>
        <h1>Sudoku Pro</h1>
        <button class="theme-toggle" id="btn-theme" title="Alternar Tema">🌙</button>
    </header>

    <div class="dashboard">
        <div class="controls-top">
            <select id="difficulty" aria-label="Dificuldade">
                <option value="easy">Fácil (1x)</option>
                <option value="medium" selected>Médio (1.5x)</option>
                <option value="hard">Difícil (2x)</option>
            </select>
            <button class="primary" id="btn-new-game">Novo Jogo</button>
            <button id="btn-scores">Ranking</button>
        </div>
        <div class="controls-bottom">
            <button class="toggle-btn" id="btn-mode" title="Atalho: Barra de Espaço ou M" aria-pressed="false">
                <span id="mode-icon">✒️</span> <span id="mode-text">Caneta</span>
            </button>
            <div class="stat-box">
                <small>Tempo</small>
                <span class="stat-value" id="timer" aria-live="polite">60:00</span>
            </div>
            <div class="stat-box">
                <small>Pontos</small>
                <span class="stat-value" id="score" aria-live="polite">0</span>
            </div>
        </div>
    </div>

    <div class="game-area" id="game-area">
        <div class="board" id="board" role="grid" aria-label="Tabuleiro de Sudoku"></div>
        <div class="numpad" id="numpad" role="group" aria-label="Teclado numérico">
            <button data-val="1" aria-label="1">1</button>
            <button data-val="2" aria-label="2">2</button>
            <button data-val="3" aria-label="3">3</button>
            <button data-val="4" aria-label="4">4</button>
            <button data-val="5" aria-label="5">5</button>
            <button data-val="6" aria-label="6">6</button>
            <button data-val="7" aria-label="7">7</button>
            <button data-val="8" aria-label="8">8</button>
            <button data-val="9" aria-label="9">9</button>
            <button class="btn-erase" data-val="0" aria-label="Apagar">Apagar</button>
        </div>
    </div>

    <div class="modal-overlay" id="modal-gameover" aria-hidden="true">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="gameover-title">
            <h2 id="gameover-title" style="color: var(--danger)">Tempo Esgotado!</h2>
            <p>O tempo acabou. Deseja tentar novamente?</p>
            <button class="primary" id="btn-retry">Tentar Novamente</button>
        </div>
    </div>

    <div class="modal-overlay" id="modal-victory" aria-hidden="true">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="victory-title">
            <h2 id="victory-title" style="color: #198754">Vitória! 🎉</h2>
            <p>Você completou o Sudoku!</p>
            <p>Pontuação Final: <strong id="final-score">0</strong></p>
            <input type="text" id="player-name" placeholder="Digite seu nome" maxlength="15" aria-label="Nome do jogador">
            <button class="primary" id="btn-save-score">Salvar Pontuação</button>
        </div>
    </div>

    <div class="modal-overlay" id="modal-ranking" aria-hidden="true">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="ranking-title">
            <h2 id="ranking-title">🏆 High Scores</h2>
            <div style="max-height: 250px; overflow-y: auto;">
                <table class="score-table" role="table">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Dif.</th>
                            <th>Pontos</th>
                            <th>Tempo</th>
                        </tr>
                    </thead>
                    <tbody id="ranking-body"></tbody>
                </table>
            </div>
            <button class="primary" id="btn-close-ranking" style="margin-top: 1rem;">Fechar</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
